<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vérification responsive TempoGym</title><style>body{margin:0;background:#edf0f5;color:#102444;font:14px Arial,sans-serif}header{padding:12px;text-align:center}label{display:inline-flex;gap:10px;align-items:center}select{font:inherit;padding:6px}iframe{display:block;width:390px;max-width:100%;height:844px;margin:0 auto;border:1px solid #6c7c91;background:white}output{display:block;margin-top:8px}</style></head><body><header><label>Largeur du site<select id="width"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="768">768 px</option></select></label><output id="result">Chargement de la vérification…</output></header><iframe id="preview" title="Site TempoGym à la largeur choisie" src="./"></iframe><script>const frame=document.getElementById('preview'),width=document.getElementById('width'),result=document.getElementById('result');function report(){try{const d=frame.contentDocument;result.textContent='Largeur : '+d.documentElement.clientWidth+' px · débordement horizontal : '+Math.max(0,d.documentElement.scrollWidth-d.documentElement.clientWidth)+' px';}catch(_){result.textContent='Lecture de la page en attente.';}}width.addEventListener('change',()=>{frame.style.width=width.value+'px';requestAnimationFrame(()=>requestAnimationFrame(report));});frame.addEventListener('load',report);</script></body></html>
